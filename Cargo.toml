[workspace]
members = [
  "crates/investigation-cli",
  "crates/investigation-core",
  "crates/investigation-recording",
  "crates/investigation-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
investigation-core = { path = "crates/investigation-core" }
investigation-recording = { path = "crates/investigation-recording" }
investigation-store = { path = "crates/investigation-store" }

[workspace.lints.rust]
unsafe_code = "deny"
