[workspace]
members = [
  "crates/investigation-cli",
  "crates/investigation-core",
  "crates/investigation-recording",
  "crates/investigation-render",
  "crates/investigation-store",
  "examples/rust-producer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
investigation-core = { path = "crates/investigation-core" }
investigation-recording = { path = "crates/investigation-recording" }
investigation-store = { path = "crates/investigation-store" }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
