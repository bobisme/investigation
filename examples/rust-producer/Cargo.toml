[package]
name = "example-rust-producer"
description = "Neutral example producer and conformance adapter built on investigation-recording"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "example-rust-producer"
path = "src/main.rs"

# Only the public recording API. Nothing in the core crates depends on this package:
# delete this directory and its line in the workspace `members` and the core builds unchanged.
[dependencies]
investigation-recording.workspace = true
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
# Test setup only: creates the workspace that the runner would create with `investigation init`.
investigation-store.workspace = true
tempfile = "=3.27.0"
