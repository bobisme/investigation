[package]
name = "investigation-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

[dependencies]
investigation-core = { path = "../crates/investigation-core" }
investigation-store = { path = "../crates/investigation-store" }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.149"
uuid = "=1.23.1"

[[bin]]
name = "decode_command"
path = "fuzz_targets/decode_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_transaction"
path = "fuzz_targets/validate_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_event"
path = "fuzz_targets/decode_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_journal"
path = "fuzz_targets/replay_journal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_selector"
path = "fuzz_targets/parse_selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_selector"
path = "fuzz_targets/resolve_selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_method_pack"
path = "fuzz_targets/load_method_pack.rs"
test = false
doc = false
bench = false
