[package]
name = "investigation-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

[dependencies]
investigation-core = { path = "../crates/investigation-core" }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.149"
uuid = "=1.23.1"

[[bin]]
name = "decode_command"
path = "fuzz_targets/decode_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_transaction"
path = "fuzz_targets/validate_transaction.rs"
test = false
doc = false
bench = false
