[package]
name = "investigation-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
investigation-core.workspace = true
investigation-store.workspace = true
rustix = { version = "=1.1.6", features = ["fs"] }
schemars = "=1.2.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[dev-dependencies]
# Parses generated Markdown in tests to prove authored text stays inert.
pulldown-cmark = { version = "=0.13.6", default-features = false }
yaml_serde = "=0.10.7"
tempfile = "=3.27.0"
