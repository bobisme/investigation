[package]
name = "investigation-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "investigation"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
investigation-core.workspace = true
investigation-recording.workspace = true
investigation-render = { path = "../investigation-render" }
investigation-store.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The benchmark harness, for its smoke test against this binary.
investigation-bench = { path = "../investigation-bench" }
jsonschema = { version = "=0.28.3", default-features = false }
# Parses rendered vault notes in the scenario vault tests.
pulldown-cmark = { version = "=0.13.6", default-features = false }
tempfile = "3.27"
