[package]
name = "investigation-bench"
description = "Performance harness for the plan's warm read and mutation targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "investigation-bench"
path = "src/main.rs"

# Fixtures are generated through the public store API; latency is measured by
# spawning the real `investigation` binary. Nothing depends on this package
# except the CLI's smoke test.
[dependencies]
investigation-core.workspace = true
investigation-store.workspace = true
serde_json = "=1.0.149"
tempfile = "=3.27.0"
