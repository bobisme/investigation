name: Fuzz

on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_command
          - validate_transaction
          - decode_event
          - replay_journal
          - parse_selector
          - resolve_selector
          - load_method_pack
    env:
      FUZZ_BUDGET: ${{ github.event_name == 'schedule' && 'scheduled' || 'quick' }}
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-08-21 --profile minimal
      - run: cargo +nightly-2026-08-21 install --locked cargo-fuzz --version 0.13.2
      - run: python3 fuzz/run.py "$FUZZ_BUDGET" "$FUZZ_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
