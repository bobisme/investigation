name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install --locked just --version 1.57.0
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: just check
      - run: python3 scripts/check-fixture-families.py
      - run: python3 scripts/test-a-gate-runner.py
      - name: Exercise the README and worked cases against the public binary
        run: |
          cargo build --locked -p investigation-cli
          python3 scripts/check-cli-goldens.py target/debug/investigation
          python3 scripts/check-readme-quickstart.py target/debug/investigation
          python3 scripts/prove_milestone_a.py target/debug/investigation
      - name: Check the minimum supported Rust version
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --workspace --all-targets --all-features

  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fetch --locked
      - name: Test in an isolated network namespace
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          tool_path="$(mktemp -d)"
          for tool in cc as ld; do
            ln -s "$(command -v "$tool")" "$tool_path/$tool"
          done
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            /usr/bin/env -i HOME="$HOME" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            PATH="$toolchain_bin:$tool_path" \
            cargo test --locked --offline --workspace --all-features
