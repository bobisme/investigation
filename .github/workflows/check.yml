name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Record the runner platform for the support matrix
        run: |
          uname -srm
          findmnt --target . --noheadings --output FSTYPE,OPTIONS
          findmnt --target "$RUNNER_TEMP" --noheadings --output FSTYPE,OPTIONS
          python3 --version
      - run: cargo install --locked just --version 1.57.0
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: just check
      - run: python3 scripts/check-fixture-families.py
      - run: python3 scripts/seal-release-families.py verify --public
      - run: python3 scripts/check-scenario-d-fixture.py
      - run: python3 scripts/check-scenario-b-fixture.py
      - run: python3 scripts/test-a-gate-runner.py
      - run: python3 scripts/grade-a-gate.py self-test
      - run: python3 scripts/check-a-gate-fixtures.py
      - run: python3 scripts/check-first-use.py
      - name: Exercise the README and worked cases against the public binary
        env:
          V1_SCHEMA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo build --locked -p investigation-cli
          python3 scripts/check-v1-schemas.py target/debug/investigation --against "$V1_SCHEMA_BASE"
          python3 scripts/check-v1-legacy.py target/debug/investigation
          python3 scripts/check-cli-goldens.py target/debug/investigation
          # Runs docs/quickstart.md's install block as written, then both
          # quickstarts from empty directories with the installed executable.
          python3 scripts/check-readme-quickstart.py target/debug/investigation --install "$RUNNER_TEMP/cargo-install"
          python3 scripts/prove_milestone_a.py target/debug/investigation
          python3 scripts/scenario_b_proof.py --bin target/debug/investigation
          python3 scripts/check-diagnostic-logs.py target/debug/investigation
          python3 examples/python-producer/producer.py --bin target/debug/investigation --workspace "$RUNNER_TEMP/python-producer" --fixtures fixtures
      - name: Check the minimum supported Rust version
        # The toolchain must equal `rust-version` in Cargo.toml; tests/docs.rs
        # checks that, and docs/support-matrix.md lists it.
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 check --locked --workspace --all-targets --all-features

  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fetch --locked
      - name: Test in an isolated network namespace
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          # ar is required by the bundled SQLite build (cc-rs); python3 by the
          # vault_scenarios and explain tests, which run the stdlib-only,
          # network-free scenario proof scripts.
          tool_path="$(mktemp -d)"
          for tool in cc as ld ar python3; do
            ln -s "$(command -v "$tool")" "$tool_path/$tool"
          done
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            /usr/bin/env -i HOME="$HOME" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            PATH="$toolchain_bin:$tool_path" \
            cargo test --locked --offline --workspace --all-features
      - name: Deterministic acceptance measures in the isolated network namespace
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          tool_path="$(mktemp -d)"
          for tool in cc as ld ar python3; do
            ln -s "$(command -v "$tool")" "$tool_path/$tool"
          done
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            /usr/bin/env -i HOME="$HOME" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            PATH="$toolchain_bin:$tool_path" \
            python3 scripts/acceptance-measures.py --offline
